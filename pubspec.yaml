name: niagara_smart_drip_irrigation
description: "Niagara Smart Drip Irrigation System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  http: ^1.5.0
  shared_preferences: ^2.5.3
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  go_router: ^17.1.0
  mockito: ^5.5.0
  connectivity_plus: ^6.1.0
  internet_connection_checker_plus: ^2.5.1
  mqtt_client: ^10.11.1
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  mocktail: ^1.0.4
  firebase_app_check: ^0.4.0+1
  intl_phone_field: ^3.2.0
  flutter_animate: ^4.5.2
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^21.0.0
  fluttertoast: ^9.0.0
  responsive_framework: ^1.5.1
  flutter_spinkit: ^5.2.2
  url_launcher: ^6.3.2
  timer_builder: ^2.0.0
  syncfusion_flutter_gauges: ^33.1.44
  logger: ^2.6.2
  crypto: ^3.0.7
  flutter_time_picker_spinner: ^2.0.0
  collection: ^1.19.1
  intl: ^0.20.2
  lottie: ^3.3.0
  fl_chart: ^1.2.0
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  excel: ^4.0.6
  share_plus: ^12.0.1
  open_filex: ^4.7.0
  flutter_svg: ^2.2.3
  dotted_border: ^3.1.0
  animated_notch_bottom_bar: ^1.0.3
  webview_flutter: ^4.13.1
  flutter_launcher_icons: ^0.14.4
  pinput: ^6.0.2
  readmore: ^3.0.0
  audioplayers: ^6.7.1
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.2
  flutter_blue_plus: ^2.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test:

flutter:
  uses-material-design: true

  assets:
    - assets/images/common/
    - assets/lottie/
    - assets/images/pump_menu_icons/
    - assets/images/icons/
    - assets/svg/node_status_svg/
    - assets/images/controller_status_check/
    - assets/images/communication_config_icons/
    - assets/ic_launcher.png
    - assets/images/report_menu/
    - assets/images/common/valve_running.gif
    - assets/sounds/beep.mp3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/ic_launcher.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/ic_launcher.png
  remove_alpha_ios: true
